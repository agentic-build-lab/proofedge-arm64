  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["04-evidence-gates"] = tl;

      const header = document.getElementById("04-evidence-gates-header");
      const railFill = document.getElementById("04-evidence-gates-rail-fill");
      const spinnerArc = document.getElementById("04-evidence-gates-spinner-arc");
      const stack = document.getElementById("04-evidence-gates-stack");
      const statusEl = document.getElementById("04-evidence-gates-ingest-status");
      const excerpt = document.getElementById("04-evidence-gates-excerpt");
      const receipt = document.getElementById("04-evidence-gates-receipt");
      const receiptChip = document.getElementById("04-evidence-gates-receipt-chip");

      const finalLockup = document.getElementById("04-evidence-gates-final");

      gsap.set(document.getElementById("04-evidence-gates-card-one"), { autoAlpha: 0 });
      gsap.set(document.getElementById("04-evidence-gates-card-two"), { autoAlpha: 0 });
      gsap.set(document.getElementById("04-evidence-gates-card-three"), { autoAlpha: 0 });
      gsap.set(excerpt, { autoAlpha: 0 });
      gsap.set(receipt, { autoAlpha: 0 });
      gsap.set(proofPlate, { autoAlpha: 0 });
      gsap.set(finalLockup, { autoAlpha: 0 });

      tl.fromTo(header, { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.08);
      tl.fromTo(railFill, { scaleX: 0 }, { scaleX: 1, duration: 15.4, ease: "none" }, 0.18);

      const spinState = { deg: 0 };
      tl.to(
        spinState,
        {
          deg: 972,
          duration: 5.44,
          ease: "none",
          onUpdate: () => spinnerArc.setAttribute("transform", `rotate(${spinState.deg} 27 27)`),
        },
        0.18,
      );

      tl.fromTo(
        document.getElementById("04-evidence-gates-card-one"),
        { scale: 0.88, y: 18, opacity: 0 },
        { scale: 1, y: 0, opacity: 1, duration: 0.58, ease: "power3.out" },
        3.0,
      );

      const STATUS_SEQUENCE = [
        { t: 0, text: "SCANNING" },
        { t: 5.62, text: "REJECTS UNSAFE / EXCESSIVE" },
      ];
      function statusAt(time) {
        for (let i = STATUS_SEQUENCE.length - 1; i >= 0; i -= 1) {
          if (time >= STATUS_SEQUENCE[i].t) return STATUS_SEQUENCE[i].text;
        }
        return STATUS_SEQUENCE[0].text;
      }
      const statusDriver = { t: 0 };
      let lastStatus = STATUS_SEQUENCE[0].text;
      tl.to(
        statusDriver,
        {
          t: 19.221,
          duration: 19.221,
          ease: "none",
          onUpdate: () => {
            const next = statusAt(statusDriver.t);
            if (next !== lastStatus) {
              statusEl.textContent = next;
              lastStatus = next;
            }
          },
        },
        0,
      );

      tl.fromTo(excerpt, { opacity: 0 }, { opacity: 1, duration: 0.42, ease: "power1.out" }, 7.0);
      tl.fromTo(
        document.getElementById("04-evidence-gates-card-two"),
        { scale: 0.9, y: 16, opacity: 0 },
        { scale: 1, y: 0, opacity: 1, duration: 0.62, ease: "power3.out" },
        7.18,
      );
      tl.fromTo(
        document.getElementById("04-evidence-gates-card-three"),
        { scale: 0.9, y: 14, opacity: 0 },
        { scale: 1, y: 0, opacity: 1, duration: 0.62, ease: "power3.out" },
        9.34,
      );

      tl.fromTo(receipt, { scaleX: 0.84, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.62, ease: "power3.out" }, 12.0);

      const checks = [
        document.getElementById("04-evidence-gates-check-one"),
        document.getElementById("04-evidence-gates-check-two"),
        document.getElementById("04-evidence-gates-check-three"),
        document.getElementById("04-evidence-gates-check-four"),
      ];
      checks.forEach((path) => {
        const len = path.getTotalLength();
        path.style.strokeDasharray = `${len}`;
        path.style.strokeDashoffset = `${len}`;
      });
      const checkTimes = [12.55, 13.28, 14.01, 14.74];
      checks.forEach((path, index) => {
        tl.to(path, { strokeDashoffset: 0, duration: 0.44, ease: "power2.out" }, checkTimes[index]);
      });

      const RECEIPT_STATES = [
        { t: 0, text: "VALIDATING" },
        { t: 15.18, text: "LEDGER READY" },
      ];
      function receiptStateAt(time) {
        for (let i = RECEIPT_STATES.length - 1; i >= 0; i -= 1) {
          if (time >= RECEIPT_STATES[i].t) return RECEIPT_STATES[i].text;
        }
        return RECEIPT_STATES[0].text;
      }
      const receiptDriver = { t: 0 };
      let lastReceiptState = RECEIPT_STATES[0].text;
      tl.to(
        receiptDriver,
        {
          t: 19.221,
          duration: 19.221,
          ease: "none",
          onUpdate: () => {
            const next = receiptStateAt(receiptDriver.t);
            if (next !== lastReceiptState) {
              receiptChip.textContent = next;
              lastReceiptState = next;
            }
          },
        },
        0,
      );

      tl.set(header, { autoAlpha: 0 }, 16.0);
      tl.set(stack, { autoAlpha: 0 }, 16.0);
      tl.set(excerpt, { autoAlpha: 0 }, 16.0);
      tl.fromTo(proofPlate, { opacity: 0 }, { opacity: 0.24, duration: 0.68, ease: "power1.out" }, 16.0);
      tl.set(finalLockup, { autoAlpha: 1 }, 16.0);
      tl.fromTo(finalLockup, { x: -42, opacity: 0 }, { x: 0, opacity: 1, duration: 0.58, ease: "power3.out" }, 16.08);
      tl.fromTo(receipt, { x: 0, scale: 1 }, { x: 18, scale: 0.94, duration: 0.68, ease: "power3.out" }, 16.08);
    })();
