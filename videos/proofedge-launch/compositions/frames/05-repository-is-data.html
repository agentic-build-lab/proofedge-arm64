    (() => {
      const frameId = "05-repository-is-data";
      const excerpt = document.getElementById(frameId + "-excerpt");
      const eyebrow = document.getElementById(frameId + "-eyebrow");
      const headlineOne = document.getElementById(frameId + "-headline-one");
      const headlineTwo = document.getElementById(frameId + "-headline-two");
      const hash = document.getElementById(frameId + "-hash");

      const pathFill = document.getElementById(frameId + "-path-fill");

      const threatKeys = ["binaries", "symlinks", "dependencies", "oversized"];
      const allCardKeys = [...threatKeys, "injection", "schema"];
      const cards = Object.fromEntries(
        allCardKeys.map((key) => [key, document.getElementById(frameId + "-" + key)]),

      const tl = gsap.timeline({ paused: true });

      tl.fromTo(excerpt, { autoAlpha: 0, x: 34 }, { autoAlpha: 1, x: 0, duration: 0.7, ease: "power3.out" }, 0);
      tl.fromTo(eyebrow, { autoAlpha: 0, x: -24 }, { autoAlpha: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.04);
      tl.fromTo(headlineOne, { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.58, ease: "power3.out" }, 0.16);
      tl.fromTo(headlineTwo, { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.58, ease: "power3.out" }, 0.62);
      tl.fromTo(hash, { autoAlpha: 0, scale: 0.88 }, { autoAlpha: 1, scale: 1, duration: 0.55, ease: "power3.out" }, 1.55);

      const initialTargets = {
        binaries: { x: -270, y: -112 },
        symlinks: { x: 270, y: -112 },
        dependencies: { x: -270, y: 112 },
        oversized: { x: 270, y: 112 },
      };
      const finalTargets = {
        binaries: { x: -550, y: -112 },
        symlinks: { x: 0, y: -112 },
        dependencies: { x: 550, y: -112 },
        oversized: { x: -550, y: 112 },
        injection: { x: 0, y: 112 },
        schema: { x: 550, y: 112 },
      };
      const entryTimes = [3.04, 4.08, 5.12, 6.16];

      const flipState = (key, nextState, at) => {
        const seen = document.getElementById(frameId + "-" + key + "-seen");
        const next = document.getElementById(frameId + "-" + key + "-" + nextState);
        const reason = document.getElementById(frameId + "-" + key + "-reason");
        tl.fromTo(seen, { autoAlpha: 1, rotationX: 0 }, { autoAlpha: 0, rotationX: -88, duration: 0.3, ease: "power2.in" }, at);
        tl.fromTo(next, { autoAlpha: 0, rotationX: 88 }, { autoAlpha: 1, rotationX: 0, duration: 0.34, ease: "power2.out" }, at + 0.24);
        tl.fromTo(reason, { autoAlpha: 0, y: 8 }, { autoAlpha: 1, y: 0, duration: 0.34, ease: "power2.out" }, at + 0.27);
      };

      threatKeys.forEach((key, index) => {
        const target = initialTargets[key];
        tl.fromTo(
          cards[key],
          { xPercent: -50, yPercent: -50, x: 0, y: 0, scale: 0.6, opacity: 0 },
          {
            x: target.x,
            y: target.y,
            scale: 1,
            opacity: 1,
            duration: 0.72,
            ease: "power3.out",
          },
          entryTimes[index],
        );
        flipState(key, "rejected", entryTimes[index] + 0.46);
      });

      threatKeys.forEach((key) => {
        const target = finalTargets[key];
        tl.to(cards[key], { x: target.x, y: target.y, duration: 0.78, ease: "power3.out" }, 8.04);
      });

      ["injection", "schema"].forEach((key, index) => {
        const target = finalTargets[key];
        tl.fromTo(
          cards[key],
          { xPercent: -50, yPercent: -50, x: 0, y: 0, scale: 0.65, opacity: 0 },
          {
            x: target.x,
            y: target.y,
            scale: 1,
            opacity: 1,
            duration: 0.76,
            ease: "power3.out",
          },
          8.72 + index * 0.92,
        );
      });
      flipState("injection", "rejected", 9.56);
      flipState("schema", "required", 10.42);

      tl.fromTo(pathFill, { scaleX: 0 }, { scaleX: 1, duration: 1, ease: "power2.out" }, 10.18);
      tl.fromTo(lineFill, { scaleX: 0 }, { scaleX: 1, duration: 1, ease: "power2.out" }, 11.42);

      const cardList = allCardKeys.map((key) => cards[key]);
      tl.to(
        cardList,
        {
          x: 0,
          y: 0,
          scale: 0.62,
          autoAlpha: 0,
          duration: 0.92,
          ease: "power3.in",
          stagger: 0.035,
        },
        13,
      );

      tl.fromTo(gate, { autoAlpha: 0, scale: 0.9 }, { autoAlpha: 1, scale: 1, duration: 0.68, ease: "power3.out" }, 13.42);

      const outlineLength = gateOutline.getTotalLength();
      gateOutline.style.strokeDasharray = `${outlineLength}`;
      gateOutline.style.strokeDashoffset = `${outlineLength}`;
      tl.to(gateOutline, { strokeDashoffset: 0, duration: 1.35, ease: "power2.out" }, 14.08);

      window.__timelines = window.__timelines || {};
      window.__timelines[frameId] = tl;
    })();
