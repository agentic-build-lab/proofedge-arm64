  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["01-trust-gap"] = tl;

      const relay = document.getElementById("01-trust-gap-relay");
      const variableEl = document.getElementById("01-trust-gap-variable");
      const chip = document.getElementById("01-trust-gap-arg-chip");
      const final = document.getElementById("01-trust-gap-final");
      const blurNode = document.getElementById("01-trust-gap-streak-blur");

      const rulePaths = [
        document.getElementById("01-trust-gap-rule-full"),
        document.getElementById("01-trust-gap-rule-left"),
        document.getElementById("01-trust-gap-rule-right"),
      ];
      rulePaths.forEach((path) => {
        const len = path.getTotalLength();
        path.style.strokeDasharray = `${len}`;
        path.style.strokeDashoffset = `${len}`;
      });
      const fullRule = rulePaths[0];
      const brokenRules = rulePaths.slice(1);

      gsap.set(brokenRules, { autoAlpha: 0 });
      gsap.set(chip, { autoAlpha: 0 });
      gsap.set(final, { autoAlpha: 0 });

      const WORDS = [
        { id: "01-trust-gap-word-ai", chars: 2 },
        { id: "01-trust-gap-word-can", chars: 3 },
      ];
      let wordClock = 0.1;
      const WORD_TIMELINE = WORDS.map((word) => {
        const start = wordClock;
        wordClock += 0.11 + word.chars * 0.025;
        return { ...word, start };
      });
      WORD_TIMELINE.forEach((word, index) => {
        tl.fromTo(
          document.getElementById(word.id),
          { y: 38, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.44, ease: index === 0 ? "power4.out" : "expo.out" },
          word.start,
        );
      });
      tl.fromTo(
        variableEl,
        { y: 48, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "circ.out" },
        0.42,
      );
      tl.to(fullRule, { strokeDashoffset: 0, duration: 0.68, ease: "power2.out" }, 0.48);

      const STATES = [
        { t: 0, text: "REWRITE" },
        { t: 2.2, text: "PARAMETER DISAPPEARS" },
        { t: 5.2, text: "EDGE CASE SHIFTS" },
        { t: 6.72, text: "TEST QUIETLY CHANGES" },
        { t: 8.3, text: "" },
      ];
      function stateAt(time) {
        for (let i = STATES.length - 1; i >= 0; i -= 1) {
          if (time >= STATES[i].t) return STATES[i];
        }
        return STATES[0];
      }
      const stateDriver = { t: 0 };
      let lastText = STATES[0].text;
      tl.to(
        stateDriver,
        {
          t: 11.307,
          duration: 11.307,
          ease: "none",
          onUpdate: () => {
            const next = stateAt(stateDriver.t).text;
            if (next !== lastText) {
              variableEl.textContent = next;
              lastText = next;
            }
          },
        },
        0,
      );

      tl.fromTo(chip, { x: 72, opacity: 0 }, { x: 0, opacity: 1, duration: 0.34, ease: "expo.out" }, 2.28);
      tl.set(chip, { autoAlpha: 0 }, 3.52);

      const blurProxy = { v: 0 };
      const writeBlur = () => blurNode.setAttribute("stdDeviation", `${blurProxy.v} 0`);
      writeBlur();

      tl.fromTo(variableEl, { x: 122, opacity: 0 }, { x: 0, opacity: 1, duration: 0.46, ease: "power4.out" }, 5.2);
      tl.fromTo(blurProxy, { v: 22 }, { v: 0, duration: 0.46, ease: "power4.out", onUpdate: writeBlur }, 5.2);
      tl.set(fullRule, { autoAlpha: 0 }, 5.2);
      tl.set(brokenRules, { autoAlpha: 1, strokeDashoffset: 0 }, 5.2);

      tl.fromTo(variableEl, { x: -112, opacity: 0 }, { x: 0, opacity: 1, duration: 0.44, ease: "expo.out" }, 6.72);
      tl.fromTo(blurProxy, { v: 18 }, { v: 0, duration: 0.44, ease: "expo.out", onUpdate: writeBlur }, 6.72);
      tl.to(brokenRules, { opacity: 0.28, duration: 0.36, ease: "power1.out" }, 6.86);

      const PULSE = 0.5;
      const BEATS = [8.3, 8.3 + PULSE * 2];
      tl.set(relay, { autoAlpha: 0 }, BEATS[0]);
      tl.set(final, { autoAlpha: 1 }, BEATS[0]);
      tl.fromTo(
        document.getElementById("01-trust-gap-final-question"),
        { scale: 1.42, filter: "blur(18px)", opacity: 0, transformOrigin: "left center" },
        { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.5, ease: "power4.out" },
        BEATS[0],
      );
      tl.fromTo(
        document.getElementById("01-trust-gap-final-answer"),
        { x: -150, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.44, ease: "expo.out" },
        BEATS[1],
      );
    })();
  </script>
