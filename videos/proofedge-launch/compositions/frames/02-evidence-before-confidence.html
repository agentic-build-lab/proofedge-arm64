  <script>
    (() => {
      const frameId = "02-evidence-before-confidence";
      const root = document.querySelector('[data-composition-id="' + frameId + '"]');
      const world = document.getElementById(frameId + "-world");
      const capture = document.getElementById(frameId + "-capture");
      const captureShell = document.getElementById(frameId + "-capture-shell");
      const reconstruction = document.getElementById(frameId + "-reconstruction");
      const sourceChip = document.getElementById(frameId + "-source");
      const migrationChip = document.getElementById(frameId + "-migration");
      const contractMap = document.getElementById(frameId + "-contract-map");
      const differentialTests = document.getElementById(frameId + "-differential-tests");
      const ledger = document.getElementById(frameId + "-ledger");
      const ledgerRows = [
        document.getElementById(frameId + "-ledger-contracts"),
        document.getElementById(frameId + "-ledger-tests"),
        document.getElementById(frameId + "-ledger-trace"),
      ];
      const localProof = document.getElementById(frameId + "-local");
      const traceableProof = document.getElementById(frameId + "-traceable");

      const cam = { scale: 2.55, x: 688.5, y: 446.25 };
      const applyCamera = () => {
        world.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.scale})`;
      };
      applyCamera();

      const tl = gsap.timeline({ paused: true });

      tl.fromTo(
        reconstruction,
        { autoAlpha: 0, y: 22 },
        { autoAlpha: 1, y: 0, duration: 0.46, ease: "power3.out" },
        0,
      );
      tl.fromTo(
        sourceChip,
        { autoAlpha: 0, x: -22 },
        { autoAlpha: 1, x: 0, duration: 0.5, ease: "power3.out" },
        0.34,
      );
      tl.fromTo(
        migrationChip,
        { autoAlpha: 0, x: -22 },
        { autoAlpha: 1, x: 0, duration: 0.5, ease: "power3.out" },
        0.92,
      );

      tl.fromTo(
        contractMap,
        { autoAlpha: 0, x: 28 },
        { autoAlpha: 1, x: 0, duration: 0.62, ease: "power3.out" },
        2.55,
      );
      tl.fromTo(
        differentialTests,
        { autoAlpha: 0, x: 28 },
        { autoAlpha: 1, x: 0, duration: 0.62, ease: "power3.out" },
        4.18,
      );

      tl.to(
        cam,
        {
          scale: 1,
          x: 0,
          y: 0,
          duration: 8,
          ease: "power4.out",
          onUpdate: applyCamera,
        },
        2.5,
      );

      tl.fromTo(
        captureShell,
        { borderColor: "rgba(243, 167, 18, 0)" },
        { borderColor: "rgba(243, 167, 18, 0.2)", duration: 0.7, ease: "power2.out" },
        6.2,
      );
      tl.fromTo(
        ledger,
        { autoAlpha: 0, x: 38 },
        { autoAlpha: 1, x: 0, duration: 0.8, ease: "power3.out" },
        6.55,
      );
      ledgerRows.forEach((row, index) => {
        tl.fromTo(
          row,
          { autoAlpha: 0, x: 20 },
          { autoAlpha: 1, x: 0, duration: 0.48, ease: "power2.out" },
          7.35 + index * 0.72,
        );
      });
      tl.fromTo(
        capture,
        { autoAlpha: 0 },
        { autoAlpha: 0.92, duration: 0.8, ease: "power2.out" },
        8.45,
      );
      tl.to(reconstruction, { autoAlpha: 0, duration: 0.78, ease: "power2.out" }, 8.5);

      tl.fromTo(
        localProof,
        { autoAlpha: 0, y: 24 },
        { autoAlpha: 1, y: 0, duration: 0.58, ease: "power3.out" },
        10.62,
      );
      tl.fromTo(
        traceableProof,
        { autoAlpha: 0, y: 24 },
        { autoAlpha: 1, y: 0, duration: 0.58, ease: "power3.out" },
        11.48,
      );

      const timings = {
        traceable: { start: 11.9, end: 12.18 },
      };
      const attackDuration = 0.16;
      const releaseDuration = 0.38;
      const restLevel = 0.08;
      const glowWords = root.querySelectorAll("[data-frame-02-word]");
      const glowDriver = { t: 0 };

      const envelope = (time, start, end) => {
        if (time < start) return 0;
        if (time < end) return Math.min((time - start) / attackDuration, 1);
        const releaseEnd = end + releaseDuration;
        if (time < releaseEnd) return 1 - ((time - end) / releaseDuration) * (1 - restLevel);
        return restLevel;
      };

      tl.to(
        glowDriver,
        {
          t: 13.781,
          duration: 13.781,
          ease: "none",
          onUpdate: () => {
            glowWords.forEach((word) => {
              const timing = timings[word.getAttribute("data-frame-02-word")];
              if (!timing) return;
              const env = envelope(glowDriver.t, timing.start, timing.end);
              word.style.textShadow = `0 0 ${42 * env}px rgba(243, 167, 18, ${0.76 * env})`;
              word.style.transform = `scale(${1 + 0.18 * env})`;
            });
          },
        },
        0,
      );

      window.__timelines = window.__timelines || {};
      window.__timelines[frameId] = tl;
    })();
  </script>
