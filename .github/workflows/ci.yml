name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install hash-locked development environment
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Reject high-confidence credential patterns
        shell: bash
        run: |
          set -euo pipefail
          if git grep -IEn \
            '(gh[pousr]_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{60,}|AKIA[0-9A-Z]{16}|hf_[A-Za-z0-9]{30,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' \
            -- .; then
            echo 'Potential credential material found in tracked files.' >&2
            exit 1
          fi
      - name: Test and enforce coverage
        run: pytest --cov=proofedge --cov-report=term-missing --cov-fail-under=75
      - name: Frozen golden evaluation
        run: proofedge evaluate --cases evaluation/cases --output evaluation/results/ci.json

  public-demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - name: Install exact demo dependencies
        run: npm ci
      - name: Validate public demo
        run: |
          npm run lint
          npm test
          npm audit --omit=dev
